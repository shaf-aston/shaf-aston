  <text x="1070" y="73" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#7dd3fc">interface</text>
  <polygon points="970,160 1070,130 1170,160 1070,190" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1070" y="165" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#a78bfa">services</text>
